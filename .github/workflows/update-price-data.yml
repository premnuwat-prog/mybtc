# อัปเดต docs/price-data.json บ่อย ๆ เพื่อให้เว็บ GitHub Pages แสดงราคาล่าสุด
name: Update price data
on:
  schedule:
    - cron: "*/15 * * * *" # ทุก 15 นาที
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-price-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/price-data.json
          git diff --cached --quiet || (git commit -m "อัปเดตราคาบิตคอยน์อัตโนมัติ" && git push)
